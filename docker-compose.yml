services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lec-facom-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./docker/app.env
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:-lec_facom}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - uploads-data:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: lec-facom-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lec_facom}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLIC_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lec_facom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: lec-facom-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lec_facom}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads-data:/uploads:ro

volumes:
  postgres-data:
  uploads-data:
